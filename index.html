<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --eha-green:#00703c;
  --eha-green2:#005c30;
  --eha-teal:#009688;
  --eha-gold:#c8a84b;
  --eha-light:#e8f5e9;
  --bg:#f5f7f5;
  --bg-card:#ffffff;
  --border:#d4e6d4;
  --text:#1a2e1a;
  --text-dim:#6b826b;
  --blue:#0ea5e9;
  --shadow:0 2px 12px rgba(0,112,60,0.10);
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl}

/* ── TOP STRIP ── */
.top-strip{
  background:var(--eha-green);
  padding:6px 24px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;color:rgba(255,255,255,.75);
  letter-spacing:.3px;
}
.top-strip strong{color:#fff}

/* ── HEADER ── */
.header{
  background:#fff;
  border-bottom:3px solid var(--eha-green);
  padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:14px;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 16px rgba(0,112,60,0.12);
}
.header-logo{display:flex;align-items:center;gap:16px}
.logo-emblem{
  width:58px;height:58px;flex-shrink:0;
  background:linear-gradient(145deg,var(--eha-green),var(--eha-green2));
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:28px;box-shadow:0 4px 16px rgba(0,112,60,0.25);
  border:2px solid var(--eha-gold);
}
.logo-text .org{font-size:11px;color:var(--eha-green);font-weight:700;letter-spacing:.5px;margin-bottom:2px}
.logo-text .name{font-size:20px;font-weight:900;color:var(--text);line-height:1.1}
.logo-text .sub{font-size:12px;color:var(--text-dim);margin-top:2px}
.header-badge{
  background:var(--eha-light);
  border:1.5px solid var(--eha-green);
  border-radius:10px;padding:8px 18px;
  font-size:13px;font-weight:700;color:var(--eha-green);
  white-space:nowrap;
}

/* ── DAY TABS ── */
.day-tabs-wrap{
  background:#fff;border-bottom:1px solid var(--border);
  padding:16px 20px 0;
  overflow-x:auto;scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
  position:sticky;top:91px;z-index:99;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.day-tabs{display:flex;gap:8px;min-width:max-content;padding-bottom:0}
.day-btn{
  background:#fff;border:1.5px solid var(--border);
  border-bottom:none;
  border-radius:10px 10px 0 0;
  padding:10px 18px 12px;
  cursor:pointer;color:var(--text-dim);
  font-family:'Cairo',sans-serif;
  text-align:center;transition:all .2s;white-space:nowrap;
}
.day-btn:hover{border-color:var(--eha-green);color:var(--eha-green);background:var(--eha-light)}
.day-btn.active{
  background:var(--eha-green);
  border-color:var(--eha-green);
  color:#fff;font-weight:700;
}
.d-date{font-size:11px;opacity:.8;margin-bottom:1px}
.d-name{font-size:15px;font-weight:700}
.d-count{
  display:inline-block;font-size:10px;margin-top:4px;
  border-radius:8px;padding:1px 8px;
}
.day-btn.active .d-count{background:rgba(255,255,255,.2);color:#fff}
.day-btn:not(.active) .d-count{background:var(--eha-light);color:var(--eha-green)}

/* ── FILTERS ── */
.filters-wrap{
  background:#fff;border-bottom:1px solid var(--border);
  padding:14px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
}
.search-wrap{position:relative;flex:1 1 220px}
.search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;color:var(--eha-green)}
input[type=text]{
  width:100%;padding:9px 36px 9px 14px;
  background:#f9fdf9;border:1.5px solid var(--border);
  border-radius:8px;color:var(--text);
  font-family:'Cairo',sans-serif;font-size:13px;
  outline:none;direction:rtl;transition:border-color .2s;
}
input[type=text]:focus{border-color:var(--eha-green);background:#fff}
input[type=text]::placeholder{color:var(--text-dim)}
select{
  padding:9px 14px;background:#f9fdf9;
  border:1.5px solid var(--border);border-radius:8px;
  color:var(--text);font-family:'Cairo',sans-serif;
  font-size:13px;cursor:pointer;outline:none;transition:border-color .2s;
}
select:focus{border-color:var(--eha-green)}
.clear-btn{
  padding:9px 14px;background:#fff3cd;border:1px solid #ffc107;
  border-radius:8px;color:#856404;
  font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;
  cursor:pointer;display:none;
}
.clear-btn.visible{display:block}

/* ── STATS ── */
.stats-wrap{
  padding:14px 20px;display:flex;gap:10px;flex-wrap:wrap;
  background:#f9fdf9;border-bottom:1px solid var(--border);
}
.stat-card{
  background:#fff;border:1.5px solid var(--border);
  border-radius:10px;padding:10px 18px;
  display:flex;align-items:center;gap:10px;flex:1 1 130px;
  box-shadow:var(--shadow);
}
.stat-icon{font-size:22px}
.stat-num{font-size:22px;font-weight:800;color:var(--eha-green);line-height:1}
.stat-lbl{font-size:11px;color:var(--text-dim);margin-top:2px}

/* ── GRID ── */
.grid{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:14px;
}
.clinic-card{
  background:#fff;border-radius:14px;
  overflow:hidden;border:1.5px solid var(--border);
  box-shadow:var(--shadow);
  transition:transform .18s,box-shadow .18s;
}
.clinic-card:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 24px rgba(0,112,60,0.14);
}
.card-head{
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:2px solid var(--accent,#00703c);
}
.card-title{font-size:14px;font-weight:800;color:#fff}
.card-badge{
  font-size:11px;font-weight:700;
  border-radius:20px;padding:2px 10px;
  background:rgba(255,255,255,.22);color:#fff;
}
.card-body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.doc-row{
  display:flex;align-items:center;justify-content:space-between;
  background:#f9fdf9;border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;
}
.doc-left{display:flex;align-items:center;gap:10px}
.doc-avatar{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;
  background:var(--eha-light);
}
.doc-name{font-size:13px;font-weight:700;color:var(--text)}
.doc-floor{font-size:11px;color:var(--text-dim);margin-top:1px}
.shift-tag{font-size:11px;font-weight:700;border-radius:8px;padding:4px 10px;white-space:nowrap}
.shift-am{color:#c8a84b;background:#fdf8e8;border:1px solid #f0d880}
.shift-pm{color:#5c7cfa;background:#eef2ff;border:1px solid #c5cff5}

/* Floor badge on card */
.floor-zone{
  font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:6px;
  background:rgba(255,255,255,.18);color:#fff;
  margin-right:8px;
}

.empty{
  grid-column:1/-1;text-align:center;
  padding:60px 20px;color:var(--text-dim);font-size:15px;
}

/* ── FOOTER ── */
.footer{
  background:var(--eha-green);
  color:rgba(255,255,255,.8);
  padding:16px 24px;text-align:center;font-size:12px;
  display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
}
.footer strong{color:#fff}
.footer-logo{font-size:20px}

@media(max-width:600px){
  .header{padding:12px 14px}
  .logo-text .name{font-size:17px}
  .logo-emblem{width:46px;height:46px;font-size:22px}
  .day-tabs-wrap{padding:12px 12px 0;top:82px}
  .filters-wrap,.stats-wrap,.grid{padding:12px}
  .grid{grid-template-columns:1fr;gap:10px}
}
</style>

  'أنف وأذن':'#b45309','أسنان':'#059669','عظام':'#4f46e5',
  'عظام استشاري':'#3730a3','أمراض الدم':'#dc2626','نفسية':'#7e22ce',
  'جراحة مخ وأعصاب':'#6d28d9','روماتيزم':'#be185d','قلب وصدر':'#b91c1c',
  'أوعية':'#92400e','وجه وفكين':'#0e7490','الأطفال':'#15803d',
  'تخدير':'#1d4ed8','عيادة الألم':'#9f1239','تجميل':'#9d174d',
  'قلب':'#e11d48','كهربا القلب':'#991b1b','كلى':'#1e40af',
  'جهاز هضمي':'#6b21a8','نساء':'#c2185b','مسالك':'#0369a1',
  'جراحة الأطفال':'#166534','جلدية':'#d97706','جراحة':'#374151',
  'رمد':'#047857','RETINA':'#166534','CATARACT':'#14532d',
  'GLAUCOMA':'#052e16','OCCUOPLAST':'#065f46','أورام':'#7f1d1d',
};
const getColor = n => COLORS[n] || '#00703c';

let activeDay = 0;

function buildTabs() {
  const tabs = document.getElementById('dayTabs');
  tabs.innerHTML = '';
  CLINIC_DATA.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (i === 0 ? ' active' : '');
    btn.innerHTML = `<div class="d-date">${d.display_date}</div><div class="d-name">${d.day}</div><div class="d-count">${d.clinics.length} عيادة</div>`;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeDay = i;
      render();
    });
    tabs.appendChild(btn);
  });
}

function render() {
  const search = document.getElementById('searchInput').value.trim();
  const shift  = document.getElementById('shiftFilter').value;
  const floor  = document.getElementById('floorFilter').value;
  document.getElementById('clearBtn').classList.toggle('visible', !!(search||shift||floor));

  const day = CLINIC_DATA[activeDay];
  const clinics = day.clinics.filter(c => {
    if (shift && c.shift !== shift) return false;
    if (floor && c.floor !== floor) return false;
    if (search && !c.doctor.includes(search) && !c.name.includes(search)) return false;
    return true;
  });

  // Stats
  document.getElementById('stats').innerHTML = [
    {icon:'🏥', num:clinics.length, lbl:'إجمالي العيادات'},
    {icon:'☀️', num:clinics.filter(c=>c.shift==='صباحي').length, lbl:'صباحي'},
    {icon:'🌙', num:clinics.filter(c=>c.shift==='مسائي').length, lbl:'مسائي'},
    {icon:'🩺', num:[...new Set(clinics.map(c=>c.name))].length, lbl:'تخصص'},
  ].map(s=>`<div class="stat-card"><span class="stat-icon">${s.icon}</span><div><div class="stat-num">${s.num}</div><div class="stat-lbl">${s.lbl}</div></div></div>`).join('');

  // Group
  const grouped = {};
  clinics.forEach(c => { (grouped[c.name]=grouped[c.name]||[]).push(c); });

  const grid = document.getElementById('grid');
  if (!Object.keys(grouped).length) {
    grid.innerHTML = '<div class="empty">لا توجد عيادات تطابق معايير البحث</div>';
    return;
  }

  grid.innerHTML = Object.entries(grouped).map(([name, docs]) => {
    const color = getColor(name);
    // Group docs by floor for display
    const rows = docs.map(c => `
      <div class="doc-row">
        <div class="doc-left">
          <div class="doc-avatar">👨‍⚕️</div>
          <div>
            <div class="doc-name">د. ${c.doctor}</div>
            <div class="doc-floor">${c.floor}</div>
          </div>
        </div>
        <span class="shift-tag ${c.shift==='صباحي'?'shift-am':'shift-pm'}">
          ${c.shift==='صباحي'?'☀️':'🌙'} ${c.shift}
        </span>
      </div>`).join('');

    return `
      <div class="clinic-card" style="border-color:${color}30">
        <div class="card-head" style="background:linear-gradient(135deg,${color},${color}cc);border-bottom-color:${color}">
          <span class="card-title">🩺 عيادة ${name}</span>
          <span class="card-badge">${docs.length} طبيب</span>
        </div>
        <div class="card-body">${rows}</div>
      </div>`;
  }).join('');
}

function clearFilters() {
  document.getElementById('searchInput').value='';
  document.getElementById('shiftFilter').value='';
  document.getElementById('floorFilter').value='';
  render();
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('shiftFilter').addEventListener('change', render);
document.getElementById('floorFilter').addEventListener('change', render);

buildTabs();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
